# The checks the orchestrator reads as evidence. The job names are the check names listed in the project's
# required_checks (`lint` and `tests`), and the orchestrator accepts them only from GitHub Actions.
name: sdlc-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
