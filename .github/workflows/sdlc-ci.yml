# The checks the orchestrator reads as evidence. Two levels, told apart by the event that triggers them:
#   CI 1 (push):         lint, tests          on every push to story/** and feature/** (and develop, main)
#   CI 2 (pull_request): lint, tests, requirement-traceability, protected-contracts, ci2-merge-result
# The job names are the check names in the project's ci1_checks / ci2_checks, and the orchestrator accepts them only
# from GitHub Actions and from this workflow file. The scripts in scripts/sdlc/ are copies of the orchestrator's ci/
# scripts (the demo repos are in another account, so they can't call its reusable workflows).
name: sdlc-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main, "story/**", "feature/**"]   # the orchestrator waits for CI on the branch, before it opens the PR

permissions:
  contents: read

env:
  ARTIFACT_REPO: SanjulikaSthirAI/orders-artifacts   # where the approved plan.json and protected-contracts.json live

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the tests (a story branch runs its own and earlier stories' locked tests, and lists what it leaves out)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          files=$(python3 scripts/sdlc/story_ci_args.py --mode files --glob 'tests/**/*.test.js' | sed '/^$/d' | tr '\n' ' ')
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/junit.xml $files
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: reports/*.xml

  # ---- CI 2 only: a story PR into the intent's feature branch (the final PR into develop carries no single story) ----

  requirement-traceability:
    name: requirement-traceability
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'feature/')
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: junit
          path: .rt/junit
      - name: Gather inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > .rt/body.md
          n=$(grep -oE 'INT-[0-9]+' .rt/body.md | head -n1 | cut -d- -f2 || true)
          if [ -z "$n" ]; then echo "The PR description must name its intent (INT-n)."; exit 2; fi
          branch=$(gh api "repos/$ARTIFACT_REPO/branches" --paginate -q '.[].name' | grep -E "^feature/INT-${n}-" | head -n1 || true)
          if [ -z "$branch" ]; then echo "No artifact-repo branch feature/INT-${n}-* found."; exit 2; fi
          folder="sdlc/${branch#feature/}"
          gh api -H "Accept: application/vnd.github.raw" "repos/$ARTIFACT_REPO/contents/$folder/plan.json?ref=$branch" > .rt/plan.json
      - name: Check requirement traceability
        run: |
          shopt -s globstar nullglob
          files=(.rt/junit/**/*.xml)
          if [ ${#files[@]} -eq 0 ]; then echo "No JUnit XML in the junit artifact."; exit 2; fi
          python scripts/sdlc/check_requirement_traceability.py --pr-body .rt/body.md --plan .rt/plan.json --junit "${files[@]}"

  protected-contracts:
    name: protected-contracts
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.3
      - name: Gather inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .pc
          printf '%s' "$PR_BODY" > .pc/body.md
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > .pc/changed.txt
          n=$(grep -oE 'INT-[0-9]+' .pc/body.md | head -n1 | cut -d- -f2 || true)
          if [ -z "$n" ]; then echo "The PR description must name its intent (INT-n)."; exit 2; fi
          branch=$(gh api "repos/$ARTIFACT_REPO/branches" --paginate -q '.[].name' | grep -E "^feature/INT-${n}-" | head -n1 || true)
          if [ -z "$branch" ]; then echo "No artifact-repo branch feature/INT-${n}-* found."; exit 2; fi
          folder="sdlc/${branch#feature/}"
          raw() { gh api -H "Accept: application/vnd.github.raw" "repos/$ARTIFACT_REPO/contents/$1?ref=$branch"; }
          raw "$folder/protected-contracts.json" > .pc/protected.json
          raw "$folder/plan.json" > .pc/plan.json 2>/dev/null || rm -f .pc/plan.json
          contract=$(python -c "import json,os; d=json.load(open('.pc/protected.json')); print((d.get('repos',{}).get(os.environ['GITHUB_REPOSITORY']) or {}).get('contract') or '')")
          if [ -n "$contract" ]; then
            git show "$BASE_SHA:$contract" > .pc/base-contract 2>/dev/null || : > .pc/base-contract
            git show "$HEAD_SHA:$contract" > .pc/head-contract 2>/dev/null || : > .pc/head-contract
          fi
      - name: Check protected contracts
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --pr-body .pc/body.md --changed .pc/changed.txt --protected .pc/protected.json --plan .pc/plan.json)
          if [ -f .pc/base-contract ]; then args+=(--base-contract .pc/base-contract --head-contract .pc/head-contract); fi
          python scripts/sdlc/check_protected_contracts.py "${args[@]}"

  locked-tests-unchanged:
    name: locked-tests-unchanged
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if a locked test changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed.txt
          python scripts/sdlc/check_locked_tests_unchanged.py --changed changed.txt

  # ---- CI 2, every PR: which merge result did this run test? (the orchestrator compares it with the PR's current one) ----

  ci2-merge-result:
    name: ci2-merge-result
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Record the merge result this run tested
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=ci2-merge-result -f head_sha="${HEAD_SHA}" -f status=completed -f conclusion=success \
            -f "output[title]=CI 2 merge result" \
            -f "output[summary]=tested_sha=${TESTED_SHA} head=${HEAD_SHA} base=${BASE_REF}"
